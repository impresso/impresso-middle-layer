# Parametrised test cases for `buildSolrQuery` (src/util/solr/queryBuilder.ts).
#
# These cases are translated from the legacy string-based tests of the
# deprecated `filtersToSolr` builder (test/unit/util/solr/reducers.test.ts)
# to the Solr JSON Query DSL produced by `buildSolrQuery`.
#
# Translation notes (structural differences between the two builders):
#  - `filtersToSolr` returned a single query string for filters of one type.
#    `buildSolrQuery` returns a `{ query, filter, params }` body: filters with
#    `scoring: true` in solrFilters.yml (content "string", entities "string",
#    "embedding") become the `query`; everything else becomes entries of the
#    `filter` array and `query` defaults to '*:*'.
#  - OR combinations become `{ bool: { should: [...], minimum_should_match: 1 } }`,
#    AND combinations become `{ bool: { must: [...] } }`.
#  - Excluded (context: exclude) clauses become
#    `{ bool: { must: ['*:*'], must_not: [...] } }` in the `filter` array.
#  - "{!join ...}" and "{!knn ...}" parser syntax become `join` / `knn` DSL nodes.
#
# Known behaviour changes vs the legacy builder (marked with [CHANGED]):
#  - "imageTypeValueOrLabel" no longer maps human-readable labels to Solr values
#    (e.g. "Image" is not converted to "image").
#  - "dateRange" no longer validates malformed strings: "foo bar" is passed
#    through instead of throwing.
#  - "string" with an empty array (or array of empty strings) produces an empty
#    `should` clause instead of wildcard field clauses.
#  - Only one "embedding" (KNN) filter is allowed per request; the legacy
#    builder ANDed multiple KNN clauses.
#
# Case fields:
#   group:          describe block name
#   name:           test name
#   namespace:      Solr namespace (index id)
#   filters:        list of impresso filters
#   solrNamespaces: (optional) mocked Solr server namespace configuration
#   features:       (optional) features config
#   options:        (optional) BuildSolrQueryOptions
#   expected:       expected { query, filter, params } body (mutually exclusive with expectedError)
#   expectedError:  expected InvalidArgumentError message (mutually exclusive with expected)

cases:
  - group: "openEndedString"
    name: "escapes parentheses"
    namespace: "entities"
    filters:
      [
        {
          "type": "string",
          "q": "H. Allen Smith (represen"
        }
      ]
    expected:
      {
        "query": {
          "bool": {
            "must": [
              "entitySuggest:H.",
              "entitySuggest:Allen",
              "entitySuggest:Smith",
              "entitySuggest:represen*"
            ]
          }
        },
        "filter": [],
        "params": {}
      }

